<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13141a">
<meta name="color-scheme" content="dark">
</head>
<body>
<title>Wheelhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column app, bottom tab bar (Wheel / Sheet / Dice), bottom sheets for wheel list and settings.
   Committed dark look: slate ground, brass accent. Segment colors are the user's, so the UI chrome stays neutral. */
:root{
  color-scheme:dark;
  --bg:#13141a; --surface:#1b1d25; --surface-2:#252834; --line:#32364a;
  --fg:#ece8df; --fg-dim:#9b9cab; --accent:#d9a441; --accent-ink:#1a1405;
  --danger:#e5645c; --ok:#6fcf97;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:12px 110px;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font:700 22px/1 var(--f-display);letter-spacing:.01em;margin:0}
h2{font:600 13px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);margin:0 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.icon{width:36px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.icon svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;font-family:var(--f-mono);font-size:13px}
input[type=color]{width:40px;height:40px;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--fg-dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* wheel picker */
.wsel{display:flex;gap:8px}
.wname{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.wname .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim)}
.wname .val{flex:1;min-width:0;font:600 18px/1.2 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wname svg{width:18px;height:18px;stroke:var(--fg-dim);fill:none;stroke-width:2;flex:none}
.wsel .btn{width:48px;padding:0}

.wheel-wrap{position:relative;width:min(100%,420px);aspect-ratio:1;max-width:100%;margin:6px auto 0;cursor:pointer}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:30px;height:30px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.spin{width:100%;min-height:56px;font:700 18px var(--f-display);letter-spacing:.06em;text-transform:uppercase}

.result{display:flex;align-items:center;gap:12px;min-height:76px}
.result .dot{width:16px;height:48px;border-radius:6px;flex:none}
.result .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim)}
.result .big{font:700 26px/1.15 var(--f-display);overflow-wrap:anywhere}
.result.pop .big{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}

.segtabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.segtabs button{flex:1;min-height:38px;border:0;background:transparent;border-radius:9px;font-weight:500;color:var(--fg-dim)}
.segtabs button[aria-selected=true]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}

.seglist{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:40px minmax(0,1fr) 68px 36px 36px;gap:6px;align-items:start}
.seg .wcell{display:flex;flex-direction:column;align-items:stretch}
.seg .w{padding:10px 6px;text-align:center;font-family:var(--f-mono);font-size:15px}
.seg .pct{font:500 11px var(--f-mono);color:var(--fg-dim);text-align:center;margin-top:2px}
.seg.is-out .n,.seg.is-out .w{opacity:.45;text-decoration:line-through}
.seg.is-out input[type=color]{opacity:.45}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:0}
.hist time{font:500 12px var(--f-mono);color:var(--fg-dim);width:44px;flex:none}
.hist i{width:10px;height:10px;border-radius:50%;flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--fg-dim)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.switch small{display:block;color:var(--fg-dim);font-size:13px}

/* roll sheet */
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.sname{font-size:13px;color:var(--fg-dim)}
.sres{display:flex;gap:8px;align-items:center;font:600 18px/1.2 var(--f-display);overflow-wrap:anywhere}
.sres i{width:10px;height:10px;border-radius:50%;flex:none}
.sres.none{color:var(--fg-dim);font-weight:400;font-family:var(--f-body);font-size:15px}
.out-text{white-space:pre-wrap;font:13px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;overflow-wrap:anywhere}

/* dice */
.stage{display:grid;place-items:center;padding:6px 0}
.dsvg{width:min(62vw,220px);height:auto;overflow:visible}
.dsvg .shape *{fill:var(--surface-2);stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.dsvg .shape .in{fill:none;stroke-width:1.5;opacity:.45}
.dsvg text{fill:var(--fg);font-family:var(--f-mono);font-weight:500}
.dsvg.crit .shape *{stroke:var(--ok)}
.dsvg.fail .shape *{stroke:var(--danger)}
.dsvg.tumble{animation:wob .18s linear infinite}
@keyframes wob{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.04)}100%{transform:rotate(-7deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{min-height:40px;min-width:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:500 14px var(--f-mono)}
.dchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:34px;text-align:center;font:500 17px var(--f-mono)}
.stepper .btn{width:40px;min-height:40px;padding:0}
.ctl{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
.ctl label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim);display:block;margin-bottom:4px}
.rc{display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 8px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font:500 15px var(--f-mono)}
.rc.drop{opacity:.4;text-decoration:line-through}
.total{font:700 15px var(--f-display);color:var(--fg-dim)}

/* chrome */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.tabs button{flex:1;min-height:48px;border-radius:12px;border:0;background:transparent;color:var(--fg-dim);font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--accent);background:var(--surface-2)}
#sheet{position:fixed;inset:0;background:rgba(5,6,10,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel h3{font:700 19px var(--f-display);margin:0}
.wlist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.wlist button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.wlist button[aria-current=true]{border-color:var(--accent)}
.wlist small{color:var(--fg-dim);font-family:var(--f-mono);font-size:12px;flex:none}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:500;font-size:14px;z-index:30;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (prefers-reduced-motion:reduce){.dsvg.tumble,.result.pop .big{animation:none}}
</style>

<div class="app">
  <header class="top"><h1>Wheelhouse</h1><button class="icon" data-act="openSettings" aria-label="Settings and backup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var TAU=Math.PI*2;
var KEY='wheelhouse-v1';
var PAL=['#e4572e','#f0a202','#9ac24b','#2a9d8f','#3d84c6','#7d5fb5','#d65a8d','#b9774a','#4cb5d9','#c7c3b8'];
var $=function(s,r){return (r||document).querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var randInt=function(n){return Math.floor(Math.random()*n)};
var ICON={
  chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  wheel:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M12 12L5.6 18.4M12 12h9"/></svg>',
  sheet:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  dice:'<svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 8l4 7H8z"/></svg>'
};

/* ---------- data ---------- */
function mkSegs(list){return list.map(function(a,i){return {id:uid(),name:a[0],w:a[1],color:PAL[i%PAL.length],out:false}})}
function mkWheel(name,segs){return {id:uid(),name:name,segs:segs,noRepeat:false,inSheet:true,spinTime:4.5,hist:[]}}
function seed(){
  var w1=mkWheel('Power Tier (example)',mkSegs([['Mundane',40],['Gifted',30],['Exceptional',18],['Elite',9],['Legendary',3]]));
  var w2=mkWheel('Element (example)',mkSegs([['Fire',1],['Water',1],['Earth',1],['Air',1],['Lightning',1],['Shadow',.5],['Light',.5]]));
  var w3=mkWheel('Temperament (example)',mkSegs([['Calm',1],['Hot-headed',1],['Cunning',1],['Kind',1],['Reckless',1],['Stoic',1]]));
  return {
    wheels:[w1,w2,w3],current:w1.id,tab:'wheel',
    customDice:[
      {id:uid(),name:'Fate die',faces:['+','+','0','0','\u2212','\u2212']},
      {id:uid(),name:'Coin',faces:['Heads','Tails']}
    ],
    dice:{sides:20,count:1,mod:0,mode:'n',custom:null},
    dlog:[],sheet:{res:{},lock:{}},settings:{sound:true}
  };
}
var S;
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.wheels)&&d.wheels.length){
      d.sheet=d.sheet||{res:{},lock:{}};d.settings=d.settings||{sound:true};
      d.dice=d.dice||{sides:20,count:1,mod:0,mode:'n',custom:null};d.dlog=d.dlog||[];d.customDice=d.customDice||[];
      if(!d.wheels.some(function(w){return w.id===d.current}))d.current=d.wheels[0].id;
      return d;
    }}
  }catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var cur=function(){return S.wheels.find(function(w){return w.id===S.current})||S.wheels[0]};
var live=function(w){return w.segs.filter(function(s){return !s.out&&s.w>0})};
var sum=function(a){return a.reduce(function(t,s){return t+s.w},0)};
var ui={sub:'segs',bulk:false,fresh:false,spinning:false,rot:0};

/* ---------- helpers ---------- */
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}
function copyText(text,fb){
  var ok=function(){toast('Copied')};
  var no=function(){if(fb){fb.focus();fb.select&&fb.select();}toast('Copy blocked. Select the text and copy it.')};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,no);return}}catch(e){}
  no();
}
function arm(el,fn,label){
  if(el.dataset.armed){fn();return}
  el.dataset.armed='1';el.dataset.orig=el.textContent;el.textContent=label||'Tap again to confirm';el.classList.add('armed');
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=el.dataset.orig;el.classList.remove('armed')}},3000);
}
function fmtPct(f){var p=f*100;return (p>=10?p.toFixed(0):p.toFixed(1).replace(/\.0$/,''))+'%'}
function fmtTime(t){try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function pickWeighted(segs){var t=sum(segs),r=Math.random()*t;for(var i=0;i<segs.length;i++){r-=segs[i].w;if(r<0)return segs[i]}return segs[segs.length-1]}
function ink(hex){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?'#14151b':'#ffffff'}

/* ---------- audio ---------- */
var AC=null;
function audio(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function blip(f,d,v){
  if(!S.settings.sound||!AC)return;
  try{var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}
}

/* ---------- wheel drawing ---------- */
function drawWheel(){
  var cv=$('#cv');if(!cv)return;
  var w=cur(),segs=live(w),size=cv.clientWidth;if(!size)return;
  var dpr=window.devicePixelRatio||1,px=Math.round(size*dpr);
  if(cv.width!==px){cv.width=px;cv.height=px}
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,size,size);
  var cx=size/2,cy=size/2,R=size/2-8;
  c.beginPath();c.arc(cx,cy,R+5,0,TAU);c.fillStyle='#1b1d25';c.fill();c.strokeStyle='#32364a';c.lineWidth=2;c.stroke();
  if(!segs.length){
    c.beginPath();c.arc(cx,cy,R,0,TAU);c.fillStyle='#252834';c.fill();
    c.fillStyle='#9b9cab';c.font='500 15px "IBM Plex Sans",system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText(w.segs.length?'Every segment is out':'Add segments to begin',cx,cy);return;
  }
  var total=sum(segs),a=-Math.PI/2+ui.rot;
  segs.forEach(function(s){
    var span=s.w/total*TAU;
    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R,a,a+span);c.closePath();
    c.fillStyle=s.color;c.fill();
    if(segs.length>1){c.strokeStyle='rgba(19,20,26,.9)';c.lineWidth=2;c.stroke()}
    if(span>0.1){
      var arcH=span*R*0.7,fs=clamp(arcH*0.5,10,19),maxW=R*0.8-22;
      c.save();c.translate(cx,cy);c.rotate(a+span/2);
      c.fillStyle=ink(s.color);c.font='600 '+fs+'px "IBM Plex Sans",system-ui,sans-serif';c.textAlign='right';c.textBaseline='middle';
      var t=s.name||'';
      if(c.measureText(t).width>maxW){while(t.length>1&&c.measureText(t+'\u2026').width>maxW)t=t.slice(0,-1);t+='\u2026'}
      c.fillText(t,R-14,0);c.restore();
    }
    a+=span;
  });
  c.beginPath();c.arc(cx,cy,R*0.11,0,TAU);c.fillStyle='#1b1d25';c.fill();c.strokeStyle='#d9a441';c.lineWidth=3;c.stroke();
}
function idxAtPointer(segs){
